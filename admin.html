<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin: গ্রাহক তালিকা</title>
<style>
  :root { --bg:#eef2f6; --panel:#fff; --ink:#17212b; --muted:#5b6875; --line:#d5dde5; --accent:#0b6e8a; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.6;
    font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .9rem; }
  tr:last-child td { border-bottom: 0; }
  a { color: var(--accent); }
  button { font: inherit; color: var(--bad); background: transparent; border: 1px solid var(--bad);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
  .empty { padding: 20px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>গ্রাহক তালিকা</h1>
  <p class="sub" id="count"></p>
  <div class="wrap">
    <table>
      <thead>
        <tr><th>নাম</th><th>লোকেশন / ঠিকানা</th><th>Accuracy</th><th>সময় (UTC)</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>এখনো কোনো তথ্য জমা পড়েনি।</div>
  </div>
</main>

<script>
(function () {
  const rows = document.getElementById("rows");

  function cell(tr) {
    const td = document.createElement("td");
    tr.appendChild(td);
    return td;
  }

  function render(list) {
    rows.textContent = "";
    document.getElementById("count").textContent = "মোট " + list.length + " জন";
    document.getElementById("empty").hidden = list.length > 0;

    list.forEach((c) => {
      const tr = document.createElement("tr");

      // textContent everywhere: customer input is never treated as HTML
      cell(tr).textContent = c.name;

      const loc = cell(tr);
      if (c.lat !== null && c.lng !== null) {
        const a = document.createElement("a");
        a.href = "https://www.google.com/maps?q=" + encodeURIComponent(c.lat + "," + c.lng);
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = c.lat.toFixed(5) + ", " + c.lng.toFixed(5);
        loc.appendChild(a);
        if (c.address) loc.appendChild(document.createElement("br"));
      }
      if (c.address) loc.appendChild(document.createTextNode(c.address));

      cell(tr).textContent = c.accuracy !== null ? "±" + Math.round(c.accuracy) + " মি." : "—";
      cell(tr).textContent = c.created_at;

      const del = document.createElement("button");
      del.textContent = "মুছুন";
      del.addEventListener("click", async () => {
        if (!confirm(c.name + " এর তথ্য মুছে ফেলবেন?")) return;
        await fetch("/api/admin/customers/" + c.id, { method: "DELETE" });
        load();
      });
      cell(tr).appendChild(del);

      rows.appendChild(tr);
    });
  }

  async function load() {
    const res = await fetch("/api/admin/customers");
    if (!res.ok) { document.getElementById("count").textContent = "তালিকা আনা যায়নি।"; return; }
    render(await res.json());
  }

  load();
})();
</script>
</body>
</html>
